name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test

      # ------------------------------------------------------------------
      # Linux: self-contained AppImage
      # ------------------------------------------------------------------
      - name: Build AppImage
        if: runner.os == 'Linux'
        run: sh packaging/linux/make-appimage.sh
      - name: Upload (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: microscope-rust-linux
          path: |
            target/release/microscope-rust
            dist/Microscope-*.AppImage

      # ------------------------------------------------------------------
      # Windows: Authenticode signing + Inno Setup installer
      # ------------------------------------------------------------------
      - name: Sign executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: pwsh -File packaging/windows/sign.ps1 -File target/release/microscope-rust.exe

      - name: Build installer
        if: runner.os == 'Windows'
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss

      - name: Sign installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          Get-ChildItem dist\*.exe -ErrorAction SilentlyContinue | ForEach-Object {
            pwsh -File packaging/windows/sign.ps1 -File $_.FullName
          }

      - name: Upload (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: microscope-rust-windows
          path: |
            target/release/microscope-rust.exe
            dist/*.exe

      # ------------------------------------------------------------------
      # macOS: .app bundle, codesign, notarization and DMG
      # ------------------------------------------------------------------
      - name: Build bundle
        if: runner.os == 'macOS'
        run: sh packaging/macos/bundle.sh

      - name: Sign and notarize
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: sh packaging/macos/sign_and_notarize.sh

      - name: Build DMG
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname Microscope -srcfolder dist/Microscope.app \
            -ov -format UDZO dist/Microscope.dmg
          ditto -c -k --keepParent dist/Microscope.app dist/Microscope-app.zip

      - name: Upload (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: microscope-rust-macos
          path: |
            dist/Microscope.dmg
            dist/Microscope-app.zip

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
