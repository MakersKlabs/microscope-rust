name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --release
      - name: Clippy
        run: cargo clippy --release -- -D warnings
        continue-on-error: true
      - name: Tests
        run: cargo test
      - name: Binary size (Linux)
        if: runner.os == 'Linux'
        run: ls -lh target/release/microscope-rust
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: microscope-rust-${{ matrix.os }}
          path: target/release/microscope-rust*
