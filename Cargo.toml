[package]
name = "microscope-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Retro-styled microscope camera capture application for Linux, Windows and macOS"
license = "MIT"
repository = "https://github.com/MakersKlabs/makers_tools"
readme = "README.md"
categories = ["science", "multimedia::video"]
keywords = ["microscope", "camera", "video", "capture", "retro"]

[[bin]]
name = "microscope-rust"
path = "src/main.rs"

[dependencies]
nokhwa = { version = "0.10", features = ["input-native", "decoding"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
mp4 = "0.14"
openh264 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[target.'cfg(target_os = "windows")'.dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["glow", "default_fonts"] }
rfd = { version = "0.17", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["glow", "default_fonts"] }
rfd = { version = "0.17", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Smallest possible release binary: size-focused opt, LTO, one codegen unit,
# abort on panic and no symbols.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
